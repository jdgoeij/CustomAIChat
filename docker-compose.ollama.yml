# =============================================================================
# GPU Service — Ollama (Local LLM Inference)
# =============================================================================
# Usage:
#   .\scripts\start.ps1 gpu-start ollama
#   docker compose -f docker-compose.yml -f docker-compose.ollama.yml -f docker-compose.litellm-local.yml up -d
#
# Pull models after startup:
#   docker exec ai-ollama ollama pull gemma4
#   docker exec ai-ollama ollama pull gemma4:e2b
#   docker exec ai-ollama ollama pull llama3.2
# =============================================================================

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend

networks:
  backend:
