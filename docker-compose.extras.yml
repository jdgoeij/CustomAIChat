# =============================================================================
# Self-Hosted AI Stack — Extras (Caddy Reverse Proxy)
# =============================================================================
# Usage (combine with core stack):
#   docker compose -f docker-compose.yml -f docker-compose.extras.yml up -d
#
# Full stack:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml -f docker-compose.extras.yml up -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Caddy — Reverse Proxy with Automatic HTTPS
  # Docs: https://caddyserver.com/docs/
  #
  # Default: localhost mode (no HTTPS)
  # For production: set CADDY_DOMAIN in .env and update Caddyfile
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: ai-caddy
    restart: unless-stopped
    volumes:
      - ./config/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - frontend

networks:
  frontend:
  backend:
