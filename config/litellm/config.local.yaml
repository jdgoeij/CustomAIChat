# =============================================================================
# LiteLLM Proxy Configuration — Local Models Enabled
# Docs: https://docs.litellm.ai/docs/proxy/configs
# =============================================================================
#
# This config extends the cloud-only config.yaml with local Ollama models.
# It is mounted automatically when you run:
#   .\scripts\start.ps1 gpu-start ollama
#
# Pull models first:
#   docker exec ai-ollama ollama pull gemma4
#   docker exec ai-ollama ollama pull gemma4:e2b
#   docker exec ai-ollama ollama pull llama3.2
# =============================================================================

# --- Observability: send all calls to Langfuse ---
litellm_settings:
  drop_params: true
  set_verbose: false
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD

# --- Environment variable references ---
environment_variables:
  LANGFUSE_PUBLIC_KEY: os.environ/LANGFUSE_PUBLIC_KEY
  LANGFUSE_SECRET_KEY: os.environ/LANGFUSE_SECRET_KEY
  LANGFUSE_HOST: os.environ/LANGFUSE_HOST

# --- General proxy settings ---
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  alerting: ["log"]

# =============================================================================
# MODEL DEFINITIONS
# =============================================================================

model_list:

  # ---------------------------------------------------------------------------
  # AZURE OPENAI MODELS
  # ---------------------------------------------------------------------------
  - model_name: azure/gpt-5.4-nano-2
    litellm_params:
      model: azure/gpt-5.4-nano-2
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  - model_name: azure/gpt-5.3-codex
    litellm_params:
      model: azure/gpt-5.3-codex
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: preview

  - model_name: azure/gpt-5.4-mini
    litellm_params:
      model: azure/gpt-5.4-mini
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  # --- Azure OpenAI Image Generation ---
  - model_name: azure/gpt-image-1.5
    litellm_params:
      model: azure/gpt-image-1.5
      api_base: os.environ/AZURE_API_BASE
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION
    model_info:
      mode: image_generation

  # --- Azure AI Foundry Serverless — FLUX.2-pro ---
  - model_name: azure/flux-2-pro
    litellm_params:
      model: azure_ai/FLUX.2-pro
      api_base: os.environ/AZURE_AI_FOUNDRY_BASE
      api_key: os.environ/AZURE_API_KEY
    model_info:
      mode: image_generation

  # ---------------------------------------------------------------------------
  # OLLAMA — Local LLM Models (private, offline-capable)
  # These models run entirely on your hardware. No data leaves your machine.
  # ---------------------------------------------------------------------------

  # Gemma 4 E2B — lighter variant (2.3B effective params)
  # Same capabilities, fits comfortably on 8 GB GPUs (~7.2 GB on disk)
  - model_name: gemma4:e2b
    litellm_params:
      model: ollama/gemma4:e2b
      api_base: http://ollama:11434

  # Llama 3.2 — Meta's compact model, fast and lightweight
  - model_name: qwen3.5:9b
    litellm_params:
      model: ollama/qwen3.5:9b
      api_base: http://ollama:11434

  # ---------------------------------------------------------------------------
  # OPENAI DIRECT (optional — uncomment if you have an OpenAI API key)
  # ---------------------------------------------------------------------------
  # - model_name: openai/gpt-4o
  #   litellm_params:
  #     model: gpt-4o
  #     api_key: os.environ/OPENAI_API_KEY


# =============================================================================
# ROUTER SETTINGS (load balancing, fallbacks)
# =============================================================================
router_settings:
  routing_strategy: "cost-based-routing"
  num_retries: 2
  timeout: 120
  # Fallback: if Azure fails, try local Gemma 4
  # fallbacks:
  #   - azure/gpt-5.4-mini:
  #       - ollama/gemma4
