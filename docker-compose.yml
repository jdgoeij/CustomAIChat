# =============================================================================
# Self-Hosted AI Stack — Core Services
# =============================================================================
# Usage:
#   docker compose up -d                    # Start core stack
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d  # + GPU
#   docker compose logs -f openwebui        # Follow logs for a service
# =============================================================================

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local
  seaweedfs_data:
    driver: local
  surrealdb_data:
    driver: local

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — Shared database for LiteLLM + Langfuse
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis — Caching for LiteLLM + Langfuse worker
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ai-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./data/redis:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # ClickHouse — Analytics database for Langfuse
  # ---------------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:24
    container_name: ai-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # SeaweedFS — S3-compatible Object Storage (replaces MinIO)
  # Docs: https://github.com/seaweedfs/seaweedfs
  # Runs master + volume + filer + S3 gateway as a single all-in-one service.
  # S3 API is available internally at http://seaweedfs:8333
  # ---------------------------------------------------------------------------
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: ai-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"admin","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Tagging","Admin"]}]}' \
          "$$SEAWEEDFS_ACCESS_KEY" "$$SEAWEEDFS_SECRET_KEY" > /tmp/s3-config.json
        exec weed server \
          -s3 -s3.config=/tmp/s3-config.json -s3.port=8333 \
          -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
    environment:
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY}
    volumes:
      - seaweedfs_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8333 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # SeaweedFS — Create default bucket for Langfuse on first run
  # (uses minio/mc client which works with any S3-compatible API)
  # ---------------------------------------------------------------------------
  seaweedfs-create-bucket:
    image: minio/mc
    container_name: ai-seaweedfs-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set weed http://seaweedfs:8333 ${SEAWEEDFS_ACCESS_KEY} ${SEAWEEDFS_SECRET_KEY};
      mc mb weed/langfuse --ignore-existing;
      exit 0;
      "
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # LiteLLM Proxy — Model Router / API Gateway
  # Docs: https://docs.litellm.ai/docs/proxy/configs
  # ---------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ai-litellm
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
      - "--detailed_debug"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      AZURE_API_BASE: ${AZURE_API_BASE}
      AZURE_API_KEY: ${AZURE_API_KEY}
      AZURE_API_VERSION: ${AZURE_API_VERSION}
      AZURE_AI_FOUNDRY_BASE: ${AZURE_AI_FOUNDRY_BASE}
      # OPENAI_API_KEY: ${OPENAI_API_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: http://langfuse-web:3000
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./config/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    networks:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # Langfuse — LLM Observability, Tracing & Token Tracking
  # Docs: https://langfuse.com/docs/deployment/self-host
  # ---------------------------------------------------------------------------
  langfuse-web:
    image: langfuse/langfuse:3
    container_name: ai-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      seaweedfs-create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB}
      NEXTAUTH_URL: http://localhost:${LANGFUSE_PORT:-3001}
      NEXTAUTH_SECRET: ${LANGFUSE_SALT}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      HOSTNAME: "0.0.0.0"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    ports:
      - "${LANGFUSE_PORT:-3001}:3000"
    networks:
      - frontend
      - backend

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: ai-langfuse-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      seaweedfs-create-bucket:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${LANGFUSE_DB}
      SALT: ${LANGFUSE_SALT}
      ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_CLUSTER_ENABLED: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_AUTH: ${REDIS_PASSWORD}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: us-east-1
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://seaweedfs:8333
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
    networks:
      - backend

  # ---------------------------------------------------------------------------
  # SurrealDB — Database for Open Notebook
  # Docs: https://surrealdb.com/docs
  # ---------------------------------------------------------------------------
  surrealdb:
    image: surrealdb/surrealdb:v2
    container_name: ai-surrealdb
    restart: unless-stopped
    command: start --user ${SURREALDB_USER:-root} --pass ${SURREALDB_PASSWORD} --bind 0.0.0.0:8000 rocksdb:/mydata/mydatabase.db
    volumes:
      - surrealdb_data:/mydata
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "true"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Open Notebook — Self-hosted NotebookLM Alternative
  # Docs: https://github.com/lfnovo/open-notebook
  #
  # Features: Document analysis, RAG, podcast generation, multi-LLM support
  # Web UI: http://localhost:8502  |  API: http://localhost:5055
  # ---------------------------------------------------------------------------
  open-notebook:
    image: lfnovo/open_notebook:v1-latest-single
    container_name: ai-open-notebook
    restart: unless-stopped
    depends_on:
      surrealdb:
        condition: service_healthy
    environment:
      OPEN_NOTEBOOK_ENCRYPTION_KEY: ${OPEN_NOTEBOOK_ENCRYPTION_KEY}
      SURREAL_URL: ws://surrealdb:8000/rpc
      SURREAL_USER: ${SURREALDB_USER:-root}
      SURREAL_PASSWORD: ${SURREALDB_PASSWORD}
      SURREAL_NAMESPACE: open_notebook
      SURREAL_DATABASE: open_notebook
    volumes:
      - ./data/open-notebook:/app/data
    ports:
      - "${OPEN_NOTEBOOK_PORT:-8502}:8502"
      - "${OPEN_NOTEBOOK_API_PORT:-5055}:5055"
    networks:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # SearXNG— Private Meta Search Engine
  # Docs: https://docs.searxng.org/
  # ---------------------------------------------------------------------------
  searxng:
    image: searxng/searxng:latest
    container_name: ai-searxng
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET}
    volumes:
      - ./config/searxng:/etc/searxng:rw
    ports:
      - "${SEARXNG_PORT:-8080}:8080"
    networks:
      - frontend
      - backend

  # ---------------------------------------------------------------------------
  # Open WebUI — Chat Frontend
  # Docs: https://docs.openwebui.com/
  # ---------------------------------------------------------------------------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ai-openwebui
    restart: unless-stopped
    depends_on:
      - litellm
      - searxng
    environment:
      # Connect to LiteLLM as the OpenAI-compatible backend
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      # Disable direct Ollama connection (routed through LiteLLM instead)
      OLLAMA_BASE_URL: ""
      # Web search
      ENABLE_RAG_WEB_SEARCH: True
      RAG_WEB_SEARCH_ENGINE: searxng
      RAG_WEB_SEARCH_RESULT_COUNT: 3
      RAG_WEB_SEARCH_CONCURRENT_REQUESTS: 10
      SEARXNG_QUERY_URL: "http://searxng:8080/search?q=<query>"
      # Speech-to-Text (built-in Whisper)
      AUDIO_STT_ENGINE: ""
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      # General
      WEBUI_AUTH: "true"
      WEBUI_NAME: "AI Stack"
    volumes:
      - ./data/openwebui:/app/backend/data
    ports:
      - "${OPENWEBUI_PORT:-3000}:8080"
    networks:
      - frontend
      - backend
