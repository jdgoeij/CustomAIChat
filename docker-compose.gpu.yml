# =============================================================================
# Self-Hosted AI Stack — All GPU Services (convenience overlay)
# =============================================================================
# ⚠ This overlay starts Ollama + Whisper + ComfyUI together.
#   On an 8 GB GPU this WILL cause VRAM pressure.
#   Prefer the individual overlays via the start script:
#
#   .\scripts\start.ps1 gpu-start ollama    # local LLMs only
#   .\scripts\start.ps1 gpu-start whisper   # speech-to-text only
#   .\scripts\start.ps1 gpu-start comfyui   # image generation only
#   .\scripts\start.ps1 gpu-switch comfyui  # stop Ollama, start ComfyUI
#
# Individual compose files:
#   docker-compose.ollama.yml          — Ollama
#   docker-compose.whisper.yml         — Whisper + OpenWebUI STT override
#   docker-compose.comfyui.yml         — ComfyUI (Stable Diffusion)
#   docker-compose.litellm-local.yml   — LiteLLM config with local models
#
# Prerequisites:
#   - NVIDIA GPU with drivers installed
#   - NVIDIA Container Toolkit
# =============================================================================

services:

  # --- LiteLLM: mount the local-models config ---
  litellm:
    volumes:
      - ./config/litellm/config.local.yaml:/app/config.yaml:ro

  # --- OpenWebUI: enable Whisper STT ---
  openwebui:
    environment:
      AUDIO_STT_ENGINE: openai
      AUDIO_STT_OPENAI_API_BASE_URL: http://whisper:9000/v1
      AUDIO_STT_OPENAI_API_KEY: "dummy"
      WHISPER_MODEL: ${WHISPER_MODEL:-base}

  # --- Ollama ---
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ollama
    restart: unless-stopped
    volumes:
      - ./data/ollama:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend

  # --- Whisper ---
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest-gpu
    container_name: ai-whisper
    restart: unless-stopped
    environment:
      ASR_MODEL: ${WHISPER_ASR_MODEL:-base}
      ASR_ENGINE: openai_whisper
    volumes:
      - ./data/whisper:/root/.cache/whisper
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - backend

  # --- ComfyUI ---
  comfyui:
    image: ghcr.io/ai-dock/comfyui:latest-cuda
    container_name: ai-comfyui
    restart: unless-stopped
    environment:
      CLI_ARGS: "--listen 0.0.0.0 --lowvram"
    volumes:
      - ./data/comfyui/models:/workspace/ComfyUI/models
      - ./data/comfyui/output:/workspace/ComfyUI/output
      - ./data/comfyui/custom_nodes:/workspace/ComfyUI/custom_nodes
    ports:
      - "${COMFYUI_PORT:-8188}:8188"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
